zhiku:
  prompt:
    product2patent: |
      基于检索的结果对逐个专利进行分析，查找所有与问题相关的专利主权利要求，按相关性进行排序，并逐个将问题、对应专利，对应主权利要求总结和相关原因结构化输出
      所用语句均为中文    
    product2people: |
      基于检索的结果对逐个专利进行分析，查找所有与问题相关的专利主权利要求，过滤到不相关专利，然后按专利第一发明人权重最高，其他发明人权重其次进行排序，并逐个将问题，对应专利名和对应发明人，对应其角色及相关原因结构化输出
      所用语句均为中文
    product2paper: |
      基于检索的结果对逐个论文的摘要进行分析，查找所有与问题相关的论文摘要，并执行以下两步：
      1、将问题、相关论文名、相关论文摘要，相关原因结构化输出
      2、基于论文的摘要估计产品的疗效，总结概括结果
      所用语句均为中文